name: Make School
description: >-
  Make School was a San Francisco-based computer science college and coding
  bootcamp, backed by a16z, that offered an applied computer science bachelor's
  program. As of August 2021 the degree program moved to Dominican University of
  California, and Make School.org now operates as a 501(c)(3) nonprofit running a
  scholarship program for former Bachelor in Applied Computer Science students.
  The organization publishes no public API, developer portal, or technical
  documentation. It was added to the API Evangelist network as a portfolio-lead
  stub and this enrichment pass confirmed there is no API surface to catalog.
